apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: lms
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: webapp 
          image: 959222626282.dkr.ecr.ap-south-1.amazonaws.com/webapps2:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
