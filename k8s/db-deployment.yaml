apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: lms
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: 959222626282.dkr.ecr.ap-south-1.amazonaws.com/api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: DATABASE_URL
              value: "postgresql://postgres:postgres@db-service:5432/lms"
